# Marco 06 — revisão protegida da Parte VII
name: Gerar Revisão B — Marco 06

on:
  push:
    branches:
      - revisao-b-global-2026-07-20
    paths:
      - "revisao-b-global/03_ONDA_1_PRE_LIVRO_REV_B.md"
      - "revisao-b-global/04_ONDA_1_PARTE_I_REV_B.md"
      - "revisao-b-global/05_ONDA_2_PARTE_II_REV_B.md"
      - "revisao-b-global/07_ONDA_3_PARTE_III_REV_B.md"
      - "revisao-b-global/20_ONDA_4_PARTE_IV_REV_B.md"
      - "revisao-b-global/23_ONDA_5_PARTE_V_REV_B.md"
      - "revisao-b-global/26_ONDA_6_PARTE_VI_REV_B.md"
      - "revisao-integral/07_PARTE_VII_REV_A.md"
      - "scripts/gerar_revisao_b_marco_06.py"
      - "scripts/medir_amostra_kindle.py"
      - ".github/workflows/gerar-revisao-b-marco-06.yml"
  pull_request:
    branches:
      - direcao-editorial-executiva-2026-07-20
    paths:
      - "revisao-b-global/03_ONDA_1_PRE_LIVRO_REV_B.md"
      - "revisao-b-global/04_ONDA_1_PARTE_I_REV_B.md"
      - "revisao-b-global/05_ONDA_2_PARTE_II_REV_B.md"
      - "revisao-b-global/07_ONDA_3_PARTE_III_REV_B.md"
      - "revisao-b-global/20_ONDA_4_PARTE_IV_REV_B.md"
      - "revisao-b-global/23_ONDA_5_PARTE_V_REV_B.md"
      - "revisao-b-global/26_ONDA_6_PARTE_VI_REV_B.md"
      - "revisao-integral/07_PARTE_VII_REV_A.md"
      - "scripts/gerar_revisao_b_marco_06.py"
      - "scripts/medir_amostra_kindle.py"
      - ".github/workflows/gerar-revisao-b-marco-06.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: revisao-b-marco-06-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest

    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Proteger Revisão A e Marcos anteriores
        shell: bash
        run: |
          git diff --exit-code 3c0338bdb13d6c2c66216a3bd18b3f3603a5faa2 -- \
            revisao-integral \
            manuscrito-canonico-rev-a \
            manuscrito-v13 \
            revisao-autoral \
            LER_AGORA_REPOSICIONESE_REV_A.md \
            VISUALIZAR_REVISAO_INTEGRAL_A.md
          test -s marcos-revisao-b/MARCO_01_PRE_LIVRO_PARTES_I_II.md
          test -s marcos-revisao-b/MARCO_02_PRE_LIVRO_PARTES_I_II_III.md
          test -s marcos-revisao-b/MARCO_03_PRE_LIVRO_PARTES_I_II_III_IV.md
          test -s marcos-revisao-b/MARCO_04_PRE_LIVRO_PARTES_I_II_III_IV_V.md
          test -s marcos-revisao-b/MARCO_05_PRE_LIVRO_PARTES_I_II_III_IV_V_VI.md

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas editoriais
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer fonts-liberation poppler-utils

      - name: Gerar Parte VII, manuscrito contínuo e Marco 06
        run: python scripts/gerar_revisao_b_marco_06.py

      - name: Medir amostra editorial Kindle
        run: python scripts/medir_amostra_kindle.py

      - name: Gerar DOCX do Marco 06
        run: |
          mkdir -p dist-revisao-b
          pandoc marcos-revisao-b/MARCO_06_PRE_LIVRO_PARTES_I_II_III_IV_V_VI_VII.md \
            --from=markdown+yaml_metadata_block \
            --to=docx \
            --toc \
            --toc-depth=2 \
            --metadata toc-title="SUMÁRIO" \
            --metadata title="REPOSICIONE-SE™" \
            --metadata subtitle="Método da Árvore do Discernimento — Revisão B — Marco 06" \
            --metadata author="Sol Lima" \
            -o dist-revisao-b/REPOSICIONESE_REV_B_MARCO_06_PRE_LIVRO_PARTES_I_II_III_IV_V_VI_VII.docx

      - name: Gerar PDF do Marco 06
        run: |
          mkdir -p dist-revisao-b/pdf
          libreoffice --headless --convert-to pdf \
            --outdir dist-revisao-b/pdf \
            dist-revisao-b/REPOSICIONESE_REV_B_MARCO_06_PRE_LIVRO_PARTES_I_II_III_IV_V_VI_VII.docx
          mv dist-revisao-b/pdf/REPOSICIONESE_REV_B_MARCO_06_PRE_LIVRO_PARTES_I_II_III_IV_V_VI_VII.pdf \
             dist-revisao-b/REPOSICIONESE_REV_B_MARCO_06_PRE_LIVRO_PARTES_I_II_III_IV_V_VI_VII.pdf
          rmdir dist-revisao-b/pdf

      - name: Verificar renderização do PDF
        shell: bash
        run: |
          mkdir -p dist-revisao-b/render
          pdfinfo dist-revisao-b/REPOSICIONESE_REV_B_MARCO_06_PRE_LIVRO_PARTES_I_II_III_IV_V_VI_VII.pdf
          pdftoppm -png -r 110 \
            dist-revisao-b/REPOSICIONESE_REV_B_MARCO_06_PRE_LIVRO_PARTES_I_II_III_IV_V_VI_VII.pdf \
            dist-revisao-b/render/pagina >/dev/null 2>&1
          test "$(find dist-revisao-b/render -name 'pagina-*.png' -size +0c | wc -l)" -gt 0

      - name: Validar manuscritos e arquivos
        shell: bash
        run: |
          test -s revisao-b-global/29_ONDA_7_PARTE_VII_REV_B.md
          test -s manuscrito-revisao-b/REPOSICIONESE_REV_B_CONTINUO.md
          test -s marcos-revisao-b/MARCO_01_PRE_LIVRO_PARTES_I_II.md
          test -s marcos-revisao-b/MARCO_02_PRE_LIVRO_PARTES_I_II_III.md
          test -s marcos-revisao-b/MARCO_03_PRE_LIVRO_PARTES_I_II_III_IV.md
          test -s marcos-revisao-b/MARCO_04_PRE_LIVRO_PARTES_I_II_III_IV_V.md
          test -s marcos-revisao-b/MARCO_05_PRE_LIVRO_PARTES_I_II_III_IV_V_VI.md
          test -s marcos-revisao-b/MARCO_06_PRE_LIVRO_PARTES_I_II_III_IV_V_VI_VII.md
          test -s revisao-b-global/16_MEDICAO_EDITORIAL_10_PORCENTO_KINDLE.md
          test -s dist-revisao-b/REPOSICIONESE_REV_B_MARCO_06_PRE_LIVRO_PARTES_I_II_III_IV_V_VI_VII.docx
          test -s dist-revisao-b/REPOSICIONESE_REV_B_MARCO_06_PRE_LIVRO_PARTES_I_II_III_IV_V_VI_VII.pdf
          python - <<'PY'
          from pathlib import Path
          import re
          full = Path('manuscrito-revisao-b/REPOSICIONESE_REV_B_CONTINUO.md').read_text(encoding='utf-8')
          part7 = Path('revisao-b-global/29_ONDA_7_PARTE_VII_REV_B.md').read_text(encoding='utf-8')
          mark6 = Path('marcos-revisao-b/MARCO_06_PRE_LIVRO_PARTES_I_II_III_IV_V_VI_VII.md').read_text(encoding='utf-8')
          kindle = Path('revisao-b-global/16_MEDICAO_EDITORIAL_10_PORCENTO_KINDLE.md').read_text(encoding='utf-8')
          chapter_re = re.compile(r'^# CAP[IÍ]TULO\s+(\d+)\b', flags=re.M|re.I)
          assert [int(x) for x in chapter_re.findall(part7)] == list(range(27, 33))
          assert [int(x) for x in chapter_re.findall(mark6)] == list(range(1, 33))
          assert [int(x) for x in chapter_re.findall(full)] == list(range(1, 39))
          assert re.search(r'^# EP[IÍ]LOGO\b', full, flags=re.M|re.I)
          assert 'Partes I–VII revisados' in full
          assert 'Filtro proporcional' in part7
          assert 'Regra de parada do Filtro' in part7
          assert 'Mecanismo que pode aparecer' in part7
          assert 'O objeto exato da Poda' in part7
          assert 'MEDIÇÃO EDITORIAL DOS 10% KINDLE' in kindle
          print('Validação concluída: Parte VII 27–32; Marco 06 1–32; contínuo 1–38 + Epílogo.')
          PY

      - name: Versionar Parte VII, manuscrito, Marco 06 e medição
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revisao-b-global/29_ONDA_7_PARTE_VII_REV_B.md \
                  manuscrito-revisao-b/REPOSICIONESE_REV_B_CONTINUO.md \
                  marcos-revisao-b/MARCO_06_PRE_LIVRO_PARTES_I_II_III_IV_V_VI_VII.md \
                  revisao-b-global/16_MEDICAO_EDITORIAL_10_PORCENTO_KINDLE.md
          if git diff --cached --quiet; then
            echo "Parte VII, manuscritos e medição já estão atualizados."
          else
            git commit -m "Atualiza Parte VII, manuscrito contínuo B, Marco 06 e medição Kindle"
            git push origin HEAD:revisao-b-global-2026-07-20
          fi

      - name: Publicar pacote de leitura do Marco 06
        uses: actions/upload-artifact@v4
        with:
          name: reposicionese-revisao-b-marco-06-${{ github.event_name }}
          path: |
            revisao-b-global/29_ONDA_7_PARTE_VII_REV_B.md
            manuscrito-revisao-b/REPOSICIONESE_REV_B_CONTINUO.md
            marcos-revisao-b/MARCO_06_PRE_LIVRO_PARTES_I_II_III_IV_V_VI_VII.md
            revisao-b-global/16_MEDICAO_EDITORIAL_10_PORCENTO_KINDLE.md
            dist-revisao-b/REPOSICIONESE_REV_B_MARCO_06_PRE_LIVRO_PARTES_I_II_III_IV_V_VI_VII.docx
            dist-revisao-b/REPOSICIONESE_REV_B_MARCO_06_PRE_LIVRO_PARTES_I_II_III_IV_V_VI_VII.pdf
            dist-revisao-b/render
          if-no-files-found: error
          retention-days: 30
