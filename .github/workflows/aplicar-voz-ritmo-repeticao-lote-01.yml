name: Aplicar Voz, Ritmo e Repetição — Lote 01

on:
  push:
    branches:
      - revisao-b-global-2026-07-20
    paths:
      - "scripts/aplicar_voz_ritmo_repeticao_lote_01.py"
      - "scripts/sincronizar_estado_pos_voz_lote_01.py"
      - ".github/workflows/aplicar-voz-ritmo-repeticao-lote-01.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voz-ritmo-lote-01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aplicar:
    runs-on: ubuntu-latest

    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar passagem de voz e ritmo
        run: python scripts/aplicar_voz_ritmo_repeticao_lote_01.py

      - name: Regenerar manuscrito completo e Marco 07
        run: python scripts/gerar_revisao_b_marco_07.py

      - name: Medir fronteira editorial Kindle
        run: python scripts/medir_amostra_kindle.py

      - name: Sincronizar documentos de estado
        run: python scripts/sincronizar_estado_pos_voz_lote_01.py

      - name: Validar integridade e escopo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pre = Path('revisao-b-global/03_ONDA_1_PRE_LIVRO_REV_B.md').read_text(encoding='utf-8')
          part1 = Path('revisao-b-global/04_ONDA_1_PARTE_I_REV_B.md').read_text(encoding='utf-8')
          part2 = Path('revisao-b-global/05_ONDA_2_PARTE_II_REV_B.md').read_text(encoding='utf-8')
          full = Path('manuscrito-revisao-b/REPOSICIONESE_REV_B_CONTINUO.md').read_text(encoding='utf-8')
          mark7 = Path('marcos-revisao-b/MARCO_07_MANUSCRITO_COMPLETO_REV_B.md').read_text(encoding='utf-8')
          kindle = Path('revisao-b-global/16_MEDICAO_EDITORIAL_10_PORCENTO_KINDLE.md').read_text(encoding='utf-8')
          entry = Path('LER_AGORA_REPOSICIONESE_REV_B.md').read_text(encoding='utf-8')
          register = Path('direcao-editorial/12_REGISTRO_MESTRE_DE_CONTEXTO.md').read_text(encoding='utf-8')
          matrix = Path('direcao-editorial/13_MATRIZ_DE_NAO_PERDA.md').read_text(encoding='utf-8')

          official = '''1. Isso é verdadeiro?
          2. Tem lógica?
          3. Tem evidência?
          4. É justo?
          5. É nobre?
          6. Constrói vínculos ou alimenta divisão?
          7. Resistiria ao tempo?
          8. Que fruto produz a curto, médio e longo prazo?
          9. É fato, narrativa ou manipulação?
          10. Estou reagindo ou discernindo?
          11. Qual parte da Árvore está falando?
          12. O que uma pessoa posicionada faria com essa informação?'''.replace('          ', '')

          assert 'Você aprenderá a observar sem transformar fruto em identidade' in pre
          assert 'Metacognição continua ligada à vida — não à ruminação.' in pre
          assert 'A investigação começa pelo que pode ser observado — antes do rótulo' in part1
          assert 'A pessoa acorda, trabalha, cuida, cumpre' in part1
          assert '[VALIDAÇÃO AUTORAL PENDENTE]' in part1
          assert 'A frase não promete saída simples nem afirma que toda porta esteja livre.' in part1
          assert 'Semente abre possibilidade, não destino.' in part2
          assert 'Uma frase, uma perda, um elogio ou uma ameaça.' in part2
          assert 'Todo aplicativo pede acesso: localização, câmera, microfone, contatos, arquivos.' in part2
          assert 'Não existe um segundo Filtro.' in part2
          assert official in pre

          chapter_re = re.compile(r'^# CAP[IÍ]TULO\s+(\d+)\b', flags=re.M | re.I)
          for label, text in {'manuscrito': full, 'Marco 07': mark7}.items():
              chapters = [int(x) for x in chapter_re.findall(text)]
              assert chapters == list(range(1, 39)), (label, chapters)
              assert len(re.findall(r'^# EP[IÍ]LOGO\b', text, flags=re.M | re.I)) == 1

          assert 'O primeiro sinal de retorno' in kindle
          assert 'CAPÍTULO 2 — A MORTE EM VIDA' in kindle
          assert 'PARTE II — SEMENTE, SOLO E CONFIGURAÇÃO' in kindle
          assert 'A JAULA ESTÁ ABERTA.' in full
          assert 'Nenhum grupo pensará automaticamente por mim' in full
          assert 'Sua possibilidade de cultivo.' in full

          assert 'voz e ritmo concluídos no Lote 01' in entry
          assert 'Lote 01 — Pré-livro e Partes I–II' in entry
          assert '**Versão:** 3.1 — Voz e ritmo, Lote 01' in register
          assert 'próximo lote textual: Partes III–IV' in register
          assert '| 24 | Mirante do Discernimento | Ponto metacognitivo | Pré-livro e Suba | CANÔNICO |' in matrix
          assert '| 35 | Filtro da Influência | Aplicação temática | Parte II/Workbook | CANÔNICO |' in matrix

          print('Validação concluída: Lote 01 refinado; capítulos 1–38, Epílogo, cânone, estado e fronteira Kindle preservados.')
          PY

      - name: Versionar passagem, integração e estado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            revisao-b-global/03_ONDA_1_PRE_LIVRO_REV_B.md \
            revisao-b-global/04_ONDA_1_PARTE_I_REV_B.md \
            revisao-b-global/05_ONDA_2_PARTE_II_REV_B.md \
            manuscrito-revisao-b/REPOSICIONESE_REV_B_CONTINUO.md \
            marcos-revisao-b/MARCO_07_MANUSCRITO_COMPLETO_REV_B.md \
            revisao-b-global/16_MEDICAO_EDITORIAL_10_PORCENTO_KINDLE.md \
            LER_AGORA_REPOSICIONESE_REV_B.md \
            direcao-editorial/12_REGISTRO_MESTRE_DE_CONTEXTO.md \
            direcao-editorial/13_MATRIZ_DE_NAO_PERDA.md
          if git diff --cached --quiet; then
            echo "A passagem do Lote 01 e o estado já estavam integrados."
          else
            git commit -m "Sincroniza estado após voz e ritmo do Lote 01"
            git push origin HEAD:revisao-b-global-2026-07-20
          fi
