name: Gerar Revisão B — Marco 02

on:
  push:
    branches:
      - revisao-b-global-2026-07-20
    paths:
      - "revisao-b-global/03_ONDA_1_PRE_LIVRO_REV_B.md"
      - "revisao-b-global/04_ONDA_1_PARTE_I_REV_B.md"
      - "revisao-b-global/05_ONDA_2_PARTE_II_REV_B.md"
      - "revisao-b-global/07_ONDA_3_PARTE_III_REV_B.md"
      - "scripts/gerar_revisao_b_marco_02.py"
      - ".github/workflows/gerar-revisao-b-marco-02.yml"
  pull_request:
    branches:
      - direcao-editorial-executiva-2026-07-20
    paths:
      - "revisao-b-global/**"
      - "scripts/gerar_revisao_b_marco_02.py"
      - ".github/workflows/gerar-revisao-b-marco-02.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: revisao-b-marco-02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest

    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Proteger Revisão A e Marco 01
        shell: bash
        run: |
          git diff --exit-code 3c0338bdb13d6c2c66216a3bd18b3f3603a5faa2 -- \
            revisao-integral \
            manuscrito-canonico-rev-a \
            manuscrito-v13 \
            revisao-autoral \
            LER_AGORA_REPOSICIONESE_REV_A.md \
            VISUALIZAR_REVISAO_INTEGRAL_A.md
          test -s marcos-revisao-b/MARCO_01_PRE_LIVRO_PARTES_I_II.md

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas editoriais
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer fonts-liberation

      - name: Gerar manuscrito contínuo e Marco 02
        run: python scripts/gerar_revisao_b_marco_02.py

      - name: Gerar DOCX do Marco 02
        run: |
          mkdir -p dist-revisao-b
          pandoc marcos-revisao-b/MARCO_02_PRE_LIVRO_PARTES_I_II_III.md \
            --from=markdown+yaml_metadata_block \
            --to=docx \
            --toc \
            --toc-depth=2 \
            --metadata toc-title="SUMÁRIO" \
            --metadata title="REPOSICIONE-SE™" \
            --metadata subtitle="Método da Árvore do Discernimento — Revisão B — Marco 02" \
            --metadata author="Sol Lima" \
            -o dist-revisao-b/REPOSICIONESE_REV_B_MARCO_02_PRE_LIVRO_PARTES_I_II_III.docx

      - name: Gerar PDF do Marco 02
        run: |
          mkdir -p dist-revisao-b/pdf
          libreoffice --headless --convert-to pdf \
            --outdir dist-revisao-b/pdf \
            dist-revisao-b/REPOSICIONESE_REV_B_MARCO_02_PRE_LIVRO_PARTES_I_II_III.docx
          mv dist-revisao-b/pdf/REPOSICIONESE_REV_B_MARCO_02_PRE_LIVRO_PARTES_I_II_III.pdf \
             dist-revisao-b/REPOSICIONESE_REV_B_MARCO_02_PRE_LIVRO_PARTES_I_II_III.pdf
          rmdir dist-revisao-b/pdf

      - name: Validar manuscritos e arquivos
        shell: bash
        run: |
          test -s manuscrito-revisao-b/REPOSICIONESE_REV_B_CONTINUO.md
          test -s marcos-revisao-b/MARCO_01_PRE_LIVRO_PARTES_I_II.md
          test -s marcos-revisao-b/MARCO_02_PRE_LIVRO_PARTES_I_II_III.md
          test -s dist-revisao-b/REPOSICIONESE_REV_B_MARCO_02_PRE_LIVRO_PARTES_I_II_III.docx
          test -s dist-revisao-b/REPOSICIONESE_REV_B_MARCO_02_PRE_LIVRO_PARTES_I_II_III.pdf
          python - <<'PY'
          from pathlib import Path
          import re
          full = Path('manuscrito-revisao-b/REPOSICIONESE_REV_B_CONTINUO.md').read_text(encoding='utf-8')
          mark1 = Path('marcos-revisao-b/MARCO_01_PRE_LIVRO_PARTES_I_II.md').read_text(encoding='utf-8')
          mark2 = Path('marcos-revisao-b/MARCO_02_PRE_LIVRO_PARTES_I_II_III.md').read_text(encoding='utf-8')
          full_chapters = [int(x) for x in re.findall(r'^# CAP[IÍ]TULO\s+(\d+)\b', full, flags=re.M|re.I)]
          mark1_chapters = [int(x) for x in re.findall(r'^# CAP[IÍ]TULO\s+(\d+)\b', mark1, flags=re.M|re.I)]
          mark2_chapters = [int(x) for x in re.findall(r'^# CAP[IÍ]TULO\s+(\d+)\b', mark2, flags=re.M|re.I)]
          assert full_chapters == list(range(1, 39)), full_chapters
          assert mark1_chapters == list(range(1, 7)), mark1_chapters
          assert mark2_chapters == list(range(1, 11)), mark2_chapters
          assert re.search(r'^# EP[IÍ]LOGO\b', full, flags=re.M|re.I)
          assert 'Partes I–III revisados' in full
          assert 'toc-title: "SUMÁRIO"' in mark2
          print('Validação concluída: contínuo 1–38 + Epílogo; Marco 01 1–6; Marco 02 1–10.')
          PY

      - name: Versionar manuscrito contínuo e Marco 02
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscrito-revisao-b/REPOSICIONESE_REV_B_CONTINUO.md \
                  marcos-revisao-b/MARCO_02_PRE_LIVRO_PARTES_I_II_III.md
          if git diff --cached --quiet; then
            echo "Os manuscritos Markdown já estão atualizados."
          else
            git commit -m "Atualiza manuscrito contínuo B e Marco 02"
            git push
          fi

      - name: Publicar pacote de leitura do Marco 02
        uses: actions/upload-artifact@v4
        with:
          name: reposicionese-revisao-b-marco-02
          path: |
            manuscrito-revisao-b/REPOSICIONESE_REV_B_CONTINUO.md
            marcos-revisao-b/MARCO_02_PRE_LIVRO_PARTES_I_II_III.md
            dist-revisao-b/REPOSICIONESE_REV_B_MARCO_02_PRE_LIVRO_PARTES_I_II_III.docx
            dist-revisao-b/REPOSICIONESE_REV_B_MARCO_02_PRE_LIVRO_PARTES_I_II_III.pdf
          if-no-files-found: error
          retention-days: 30
